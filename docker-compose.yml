# Start the app: docker compose up --build
#   Dashboard: http://localhost:3000   API: http://localhost:8000/docs
#
# The database is Supabase PostgreSQL (DATABASE_URL in .env); there is no database container.
# Migrations are applied explicitly, never on container start:
#   docker compose run --rm backend alembic upgrade head

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    healthcheck:
      # Unhealthy while the database is unreachable (the health endpoint returns 503).
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/system/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      # Started, not healthy: the dashboard should still load and show a database outage.
      - backend
